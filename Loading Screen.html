<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hawks Middle School — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Colors pulled from the crest */
    --navy-900: #0e1633;
    --navy-800: #141f47;
    --navy-700: #1b2a5e;
    --gold-500: #f4b827;
    --gold-400: #ffc83d;
    --gold-300: #ffd96a;
    --cream:    #f6ecd2;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--navy-900);
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  /* -------- Background -------- */
  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at 50% 40%, #1c2b63 0%, #0e1633 55%, #070c1f 100%);
    overflow: hidden;
  }

  /* Subtle diagonal texture */
  .stage::before {
    content: "";
    position: absolute;
    inset: -10%;
    background-image:
      repeating-linear-gradient(45deg,
        rgba(255,255,255,0.015) 0 2px,
        transparent 2px 6px);
    pointer-events: none;
  }

  /* Slow rotating gold halo behind the crest */
  .halo {
    position: absolute;
    width: 780px;
    height: 780px;
    border-radius: 50%;
    background:
      conic-gradient(from 0deg,
        rgba(244,184,39,0) 0deg,
        rgba(244,184,39,0.18) 60deg,
        rgba(244,184,39,0) 180deg,
        rgba(244,184,39,0.10) 260deg,
        rgba(244,184,39,0) 360deg);
    filter: blur(40px);
    animation: halo-spin 14s linear infinite;
    opacity: 0.9;
  }

  @keyframes halo-spin {
    to { transform: rotate(360deg); }
  }

  /* Floating specks */
  .specks {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .spark {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold-400);
    box-shadow: 0 0 8px var(--gold-400);
    opacity: 0;
    animation: rise 6s linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(20px) scale(0.6); opacity: 0; }
    10%  { opacity: 0.9; }
    90%  { opacity: 0.8; }
    100% { transform: translateY(-120vh) scale(1); opacity: 0; }
  }

  /* -------- Crest + progress ring -------- */
  .crest-wrap {
    position: relative;
    width: 420px;
    height: 420px;
    display: grid;
    place-items: center;
  }

  .ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring .track {
    fill: none;
    stroke: rgba(246, 236, 210, 0.08);
    stroke-width: 3;
  }

  .ring .progress {
    fill: none;
    stroke: var(--gold-400);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 1244; /* 2πr for r=198 */
    stroke-dashoffset: 1244;
    filter: drop-shadow(0 0 6px rgba(255, 200, 61, 0.55));
    transition: stroke-dashoffset 0.25s ease-out;
  }

  /* Tick marks around ring */
  .ticks {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    animation: tick-spin 22s linear infinite;
    opacity: 0.35;
  }
  @keyframes tick-spin { to { transform: rotate(360deg); } }

  .logo-holder {
    position: relative;
    width: 320px;
    height: 320px;
    display: grid;
    place-items: center;
    animation: float 4.2s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter:
      drop-shadow(0 18px 30px rgba(0,0,0,0.45))
      drop-shadow(0 0 22px rgba(244, 184, 39, 0.18));
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.025); }
  }

  /* Sweeping shimmer across the crest */
  .shimmer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    border-radius: 20px;
    -webkit-mask: url('assets/hawks-crest.png') center/contain no-repeat;
            mask: url('assets/hawks-crest.png') center/contain no-repeat;
  }
  .shimmer::after {
    content: "";
    position: absolute;
    top: -20%;
    left: -40%;
    width: 50%;
    height: 140%;
    background: linear-gradient(100deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.0) 40%,
      rgba(255,240,180,0.55) 50%,
      rgba(255,255,255,0.0) 60%,
      rgba(255,255,255,0) 100%);
    transform: skewX(-18deg);
    animation: sweep 3.6s ease-in-out infinite;
  }
  @keyframes sweep {
    0%   { left: -50%; }
    60%  { left: 120%; }
    100% { left: 120%; }
  }

  /* -------- Text + progress -------- */
  .caption {
    position: absolute;
    bottom: 9%;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
  }

  .loading-text {
    display: flex;
    align-items: baseline;
    gap: 2px;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--cream);
    opacity: 0.85;
  }

  .dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    margin: 0 2px;
    border-radius: 50%;
    background: var(--gold-400);
    transform: translateY(-1px);
    animation: blink 1.4s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.18s; }
  .dot:nth-child(3) { animation-delay: 0.36s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: translateY(-1px) scale(0.85); }
    40%           { opacity: 1;   transform: translateY(-1px) scale(1); }
  }

  .progress-bar {
    width: 240px;
    height: 3px;
    background: rgba(246,236,210,0.1);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: linear-gradient(90deg, var(--gold-500), var(--gold-300));
    border-radius: 999px;
    box-shadow: 0 0 10px rgba(255, 200, 61, 0.55);
    transition: width 0.25s ease-out;
  }
  .progress-label {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: rgba(246,236,210,0.55);
    font-variant-numeric: tabular-nums;
    text-transform: uppercase;
  }

  /* -------- Top-left brand mark -------- */
  .brand {
    position: absolute;
    top: 36px;
    left: 36px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: rgba(246,236,210,0.55);
    text-transform: uppercase;
  }
  .brand .pip {
    width: 6px;
    height: 6px;
    background: var(--gold-400);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--gold-400);
    animation: blink 1.4s infinite ease-in-out;
  }

  .year {
    position: absolute;
    bottom: 24px;
    right: 36px;
    font-size: 10px;
    letter-spacing: 0.35em;
    color: rgba(246,236,210,0.35);
    text-transform: uppercase;
  }

  @media (max-width: 640px) {
    .crest-wrap { width: 300px; height: 300px; }
    .logo-holder { width: 230px; height: 230px; }
    .halo { width: 520px; height: 520px; }
    .brand { top: 22px; left: 22px; font-size: 10px; }
    .year { right: 22px; font-size: 9px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .halo, .ticks, .logo-holder, .logo, .shimmer::after, .dot, .spark, .brand .pip {
      animation: none !important;
    }
  }
</style>
</head>
<body>
  <div class="stage" role="status" aria-label="Loading Hawks Middle School application">
    <div class="halo"></div>
    <div class="specks" id="specks"></div>

    <div class="brand">
      <span class="pip"></span>
      <span>Hawks Middle School</span>
    </div>

    <div class="crest-wrap">
      <!-- Progress ring -->
      <svg class="ring" viewBox="0 0 420 420" aria-hidden="true">
        <circle class="track"    cx="210" cy="210" r="198" />
        <circle class="progress" cx="210" cy="210" r="198" id="ringProgress" />
      </svg>

      <!-- Rotating tick marks -->
      <svg class="ticks" viewBox="0 0 420 420" aria-hidden="true">
        <g stroke="#f4b827" stroke-width="2" stroke-linecap="round">
          <line x1="210" y1="4"   x2="210" y2="14"  />
          <line x1="210" y1="406" x2="210" y2="416" />
          <line x1="4"   y1="210" x2="14"  y2="210" />
          <line x1="406" y1="210" x2="416" y2="210" />
          <line x1="64"  y1="64"  x2="72"  y2="72"  opacity="0.6" />
          <line x1="348" y1="64"  x2="356" y2="72"  opacity="0.6" />
          <line x1="64"  y1="348" x2="72"  y2="356" opacity="0.6" />
          <line x1="348" y1="348" x2="356" y2="356" opacity="0.6" />
        </g>
      </svg>

      <div class="logo-holder">
        <img src="assets/hawks-crest.png" alt="Hawks Middle School crest" class="logo" />
        <div class="shimmer" aria-hidden="true"></div>
      </div>
    </div>

    <div class="caption">
      <div class="loading-text" aria-hidden="true">
        <span>Loading</span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div class="progress-bar" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="progress-label" id="progressLabel">0%</div>
    </div>

    <div class="year">Est. 1979</div>
  </div>

<script>
  // --- Floating sparks ---
  (function seedSparks() {
    const layer = document.getElementById('specks');
    const n = 14;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      const left = Math.random() * 100;
      const delay = Math.random() * 6;
      const dur = 4 + Math.random() * 5;
      const size = 2 + Math.random() * 3;
      s.style.left = left + '%';
      s.style.bottom = (-5 - Math.random() * 10) + '%';
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.animationDelay = delay + 's';
      s.style.animationDuration = dur + 's';
      s.style.opacity = (0.4 + Math.random() * 0.5).toString();
      layer.appendChild(s);
    }
  })();

  // --- Fake progress loop (0 → 100, then restart) ---
  // Replace this with real loading logic when wiring into your app.
  const ring = document.getElementById('ringProgress');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const CIRC = 1244; // matches stroke-dasharray

  let pct = 0;
  let direction = 1;

  function tick() {
    // Non-linear step for a more "alive" feel
    const step = 0.4 + Math.random() * 1.6;
    pct += step * direction;

    if (pct >= 100) {
      pct = 100;
      // Hold briefly at 100, then reset to loop
      setTimeout(() => {
        pct = 0;
        update();
      }, 900);
    }

    update();
    if (pct < 100) requestAnimationFrame(tick);
    else setTimeout(tick, 950);
  }

  function update() {
    const p = Math.min(100, Math.max(0, pct));
    ring.style.strokeDashoffset = (CIRC * (1 - p / 100)).toString();
    fill.style.width = p + '%';
    label.textContent = Math.round(p) + '%';
  }

  requestAnimationFrame(tick);
</script>
</body>
</html>
